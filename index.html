            <div class="subcontainer2 rounded bg_grey">

                <div class="songlist">
                    <ul>

                                <div class="music">

            <div class="header">
                <div class="hamburger ">

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"

                </div>
            </div>
            <div class="scroll">
                <div class="tex">Spotify Playlists</div>
                <div class="playlist">

                    <div data-folder="songs/songs2" class="card">

                        <svg class="pl" width="16" height="16" viewBox="0 0 24 24" fill="black"
                            xmlns="http://www.w3.org/2000/svg">
                            <path d="M5 20V4L19 12L5 20Z" stroke="#141834" stroke-width="1.5" stroke-linejoin="round" />

                        </svg>


                        <img src="svg/happyhits.jpg" alt="" class="hits">
                        <h3>Happy Hits!</h3>
                        <p>Hits to oost your mood and fill you with ...</p>
                    </div>
                    
                    <div data-folder="songs/ncs" class="card">

                        <p>Hits to oost your mood and fill you with ...</p>
                    </div>

                    <div class="navbuttons ">
                        <button class="prev"><img src="svg/prevsong.svg" alt=""></button>

                        <button class="next"><img src="svg/nextsong.svg" alt=""></button>
                    </div>
                    <div class="volt">
                        <div class="songtime"></div>
                        <div class="volume">
                            <button class="vol"><img src="svg/volume.svg" alt=""></button>
                            <div class="range">
                                <input type="range" min="0" max="100" value="50" class="slider" id="myRange">
                            </div>

                        </div>
                    </div>

                </div>

            </div>
